# Feature provenance: where code on the Personal branch came from.
#
# Answers "where did this come from?" only. What Personal is compared against and
# kept in sync with lives in maintenance-policy.yaml. Neither file carries the
# other's fields.
#
# Schema (see docs/development/maintainability.md):
#   <FeatureName>:                     # the feature's GetShortName()
#     status: present | removed        # removed = kept as a record
#     personal_original: true | false  # true ONLY if no upstream contributed implementation
#     provenance:
#       - source: <upstreams.yaml key | personal>
#         role: <short label>          # implementation, base-feature, design-reference, ...
#         confidence: confirmed | likely | unresolved
#         evidence: [<short sha>, ...] # optional; Personal and/or upstream commits
#         note: <one line; required when unresolved>
#     components:                      # only when parts genuinely have different sources
#       <component>:
#         personal_original: true | false
#         provenance: [ ...same entry shape... ]
#
# A design-reference entry does not by itself make personal_original false.
# Never infer provenance from a path, a commit author or a generic "feat:" subject.
# Established 2026-09-25 by source comparison (file blobs and distinctive lines) against
# bottle@dac6803377, bottle/Bottle-Compendium, open-shaders/dev, jiayev/compendium-clean and
# community-shaders/dev (mainline). Features absent here are mainline features that match Bottle.

