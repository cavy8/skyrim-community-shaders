shared_integrations:
  # Neural Rendering's hooks outside its own files. `match` strings must stay present
  # (bottle_sync.py checks them); `anchor` says where.
  src/Hooks.cpp:
    nr_finished_image:
      source: personal
      anchor: "PostProcessingExtensions::Main_HDRTonemapBlendCinematic_Render"
      match: ["neuralRendering.CaptureDisplayTransform(", "neuralRendering.ApplyFinishedImage("]
  src/Deferred.cpp:
    nr_category_capture:
      source: personal
      anchor: "Deferred::EndDeferred (restore) and Main_RenderWorld_BlendedDecals (capture)"
      match: ["neuralRendering.RestoreCategories()", "neuralRendering.CaptureCategories()"]
  src/State.cpp:
    nr_settings_migration:
      source: personal
      anchor: "State::LoadFromJson, before any feature loads"
      match: ["NeuralRendering::MigrateLegacyUpscalingSettings(settings)"]
  src/State.h:
    wind_tree_bend_bit:
      source: open
      anchor: "ExtraShaderDescriptors::TreeBend (local bit, allocated downward from 31)"
      match: ["TreeBend = 1u << 29"]
    nr_extra_descriptor_bits:
      source: personal
      anchor: "ExtraShaderDescriptors: IsHumanoidActor, IsHair (local bits; see maintainability.md hot files)"
      match: ["IsHumanoidActor", "IsHair"]
  package/Shaders/Common/Permutation.hlsli:
    nr_extra_flags:
      source: personal
      anchor: "Permutation::ExtraFlags: IsHumanoidActor, IsHair - must mirror State.h"
      match: ["IsHumanoidActor", "IsHair"]
  package/Shaders/Common/SharedData.hlsli:
