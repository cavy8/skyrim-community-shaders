# Maintenance policy: what each feature on the Personal branch is compared against
# and kept synchronized with. The Bottle baseline SHA lives in upstreams.yaml.
#
# Answers "what do we compare against?" only. Where code came from lives in
# feature-provenance.yaml. Neither file carries the other's fields.
#
# Policies:
#   bottle-exact            must match the pinned Bottle SHA
#   bottle-plus-components  Bottle base + named retained components (from another upstream or personal)
#   bottle-plus-seam        Bottle base + a minimal documented hook seam for a feature owned elsewhere (Upscaling only)
#   external-maintained     Bottle does not contain this; track `reference` directly
#   personal                Personal-original implementation
#
# Per feature:
#   paths:       feature-owned files/directories tools/bottle_sync.py compares against Bottle.
#                Directories end in '/'. Files that also carry other features' hunks go under
#                shared_integrations instead.
#   components:  bottle-plus-components only; each retained component with its source and paths
#                (or hunk anchors).
#   seam:        bottle-plus-seam only; each allowed hunk, by path and a stable anchor.
#   deferred:    explicit owner decisions not to sync something (yet); one line each.
#   note:        anything else a maintainer must know; one line.

features:
  Upscaling:
    policy: bottle-plus-seam         # D2
    paths:
      - src/Features/Upscaling.cpp
      - src/Features/Upscaling.h
      - src/Features/Upscaling/
      - features/Upscaling/
    # The only permitted divergence from Bottle: one guarded call per placement stage into the
    # Neural Rendering feature (no NR logic in Upscaling). bottle_sync.py accepts a hunk when
    # every added line contains a `match` string and every removed line a `replaces` string.
    budget: 20
    seam:
      - path: src/Features/Upscaling.cpp
        anchor: "#include block"
        match: ['#include "NeuralRendering.h"']
      - path: src/Features/Upscaling.cpp
        anchor: "S1 - Upscale(), DLSS branch, the streamline.Upscale() input"
        match: ["Neural Rendering seam S1", "globals::features::neuralRendering.PrepareUpscaleInput("]
        replaces: ["streamline.Upscale(main.texture,"]
      - path: src/Features/Upscaling.cpp
        anchor: "S2+S3 - PerformUpscaling(), between Upscale() and UpscaleDepth()"
        match: ["Neural Rendering seams S2+S3", "globals::features::neuralRendering.ResolveUpscaledFrame("]
    note: >-
      S4 (ApplySharpening) eliminated: ResolveUpscaledFrame() copies NR's result back into
      sharpenerTexture (one extra display-resolution CopyResource, only while After/Separate
      Upscaling is active). Cost not yet measured in game.
    deferred:
      - "FSR4 runtime upscaler deferral (tracker, 2026-09-25) is REVERSED by D2: Upscaling adopts Bottle incl. RuntimeUpscaler.cpp (9ea5d7e64a)"
      - "Personal-only Upscaling fixes dropped by D2 (re-propose upstream if still wanted): Streamline motionVectorsDilated=true for the pre-dilated DLSS MVs; WrappedResource D3D11/12 resource names"

  WetnessEffects:
