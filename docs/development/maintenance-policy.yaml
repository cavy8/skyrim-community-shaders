shared_integrations:
  # Every hunk that differs from Bottle in these files must contain a `match` (or `removes`) string of
  # one entry; every `match` string must still be present. `removes` names Bottle code a hunk only
  # deletes. `anchor` says where the hunk lives.
  package/Shaders/Lighting.hlsl:
    nr_category_classification:
      source: personal
      anchor: "NeuralRenderingCategories include; Masks2 SV_Target7 output; category pack replacing Bottle's Masks2 write at the end of the PS"
      match: ['#include "Common/NeuralRenderingCategories.hlsli"', "float4 Masks2: SV_Target7;", "NeuralRenderingCategories::Pack("]
    wind_tree_bend:
      source: open
      anchor: "VS: TreeWind include; CameraPosAdjust in VS_PerFrame; tree samples at world positions; leafAnimationStrength into GetTreeShiftVector; trunk displacement before viewPos"
      match: ['#include "Common/TreeWind.hlsli"', "CameraPosAdjust : packoffset(c40);", "treeBendEnabled", "animationStrength", "leafAnimationStrength"]
    pseudo_sun_bounce:
      source: jiayev
      anchor: "PS: sunbounce include; cloud-gated bounce into directionalAmbientColor; faux specular bounce in the forward composite and the deferred output"
      match: ["PseudoSunBounce/sunbounce.hlsli", "PSEUDO_SUN_BOUNCE", "specularBounce"]
  package/Shaders/Utility.hlsl:
    wind_tree_bend:
      source: open
      anchor: "VS: tree bend and leaf flutter for shadow/depth passes, matching Lighting.hlsl"
      match: ['#include "Common/Permutation.hlsli"', '#include "Common/TreeWind.hlsli"', "treeBendEnabled", "leafAnimationStrength"]
  package/Shaders/RunGrass.hlsl:
    wind_grass:
      source: open
      anchor: "GrassWind/GrassWindResponse includes; ApplyGrassWindResponse replaces CalculateWindDisplacement; GrassWindResponse::Sample in the standard path; 4-float4 InstanceExtras in the GRASS_OPTIMIZATIONS path; bent normals"
      match: ['#include "Common/GrassWind.hlsli"', "GrassWindResponse", "ApplyGrassWindResponse", "InstanceExtras[instanceID * 4", "Four per instance", "GrassWind::RotateVector("]
      removes: ["vertexTerm", "CalculateWindDisplacement"]   # Bottle's vanilla wind lines this replaces
    nr_category_classification:
      source: personal
      anchor: "Masks2 Foliage category pack in both PS branches"
      match: ['#include "Common/NeuralRenderingCategories.hlsli"', "NeuralRenderingCategories::Pack("]
  package/Shaders/Sky.hlsl:
    cloud_relight_clouds:
      source: open
      anchor: "CR_CLOUDS include block after Procedural Sun's; RelightCloud on the base colour after TEXLERP"
      match: ["CR_CLOUDS", "CloudRelight"]
  package/Shaders/DeferredCompositeCS.hlsl:
    wind_debug_view:
      source: open
      anchor: "WindField include; GrassWindSpringDebug t18; wind-field debug view before the final MainRW write (Reverse Z-aware sky test)"
      match: ['#include "Common/WindField.hlsli"', "GrassWindSpringDebug", "windFieldDebugEnabled"]
  package/Shaders/Common/SharedData.hlsli:
    local_feature_data:
      source: personal
      anchor: "wind type includes; CloudRelightSettings, WindSettings, PseudoSunBounceSettings structs; FeatureData entries appended after Bottle's volumetricLightingSettings (mirrors FeatureBuffer.cpp)"
      match: ['#include "Common/TransientWindImpulse.hlsli"', "struct CloudRelightSettings", "struct PseudoSunBounceSettings", "CloudRelightSettings cloudRelightSettings;", "WindField::WindTuning WindFieldTuning;", "WindSettings windSettings;", "PseudoSunBounceSettings pseudoSunBounceSettings;"]
  package/Shaders/Common/Permutation.hlsli:
    local_extra_flags:
      source: personal
      anchor: "ExtraFlags: IsHumanoidActor (31), IsHair (30) for Neural Rendering, TreeBend (29) for Wind; must mirror State.h"
      match: ["IsHumanoidActor", "IsHair", "TreeBend"]
    wind_permutation_fields:
      source: open
      anchor: "PerShader cbuffer: Wind tree-bend and grass-wind fields after Bottle's EffectRadius (mirrors State::PermutationCB)"
      match: ["TreeBendModelSensitivity", "WindIntensityOverride"]
  package/Shaders/Common/Math.hlsli:
