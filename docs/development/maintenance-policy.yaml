# Maintenance policy: what every file on the Personal branch is compared against, and the complete
# catalogue of where Personal deviates from the pinned Bottle SHA (upstreams.yaml).
#
# Answers "what do we compare against, and why does this differ?" only. Where code came from lives
# in feature-provenance.yaml. tools/bottle_sync.py enforces this file: every file that differs from
# Bottle must be claimed by a feature, a shared integration, or a repository entry, and every hunk in
# a shared-integration file must carry one of that file's documented `match` strings.
#
# Rule of the branch (owner ruling 2026-09-26, simplification): Personal is Bottle-Compendium plus
# exactly two things - the Neural Rendering feature and the Screenshot SDR fix - and its own
# docs/tooling. Everything else that used to differ was removed; see removed-features.md. Any file not claimed below must match Bottle exactly.
# Owner-approved exceptions (2026-09-26), each documented in its feature's entry: Upscaling fix F1
# (Streamline motionVectorsDilated), a DLSS correctness fix Bottle lacks; Post Processing P1
# (feature on by default, every pipeline effect off) and P2 (DoF target focus only while actively
# targeting).
# Hair Backlighting and the "Show Background Compile Overlay" toggle were also Personal's until
# Bottle merged them (978eb4d9f2, PRs #3 and #4). They are Bottle's now and have no entry here;
# the files match Bottle exactly.
# Owner-requested local feature (2026-09-28): Hair Strands (mesh-to-strand hair), a new personal
# feature; its Lighting.hlsl hunks are additive and gated on HAIR_STRANDS.
#
# Policies:
#   bottle-plus-components  Bottle base + named retained components (from another upstream or personal)
#   bottle-plus-seam        Bottle base + a minimal documented hook seam for a feature owned elsewhere
#   personal                Personal-original implementation
#
# Per feature:
#   paths:        feature-owned files/directories (directories end in '/').
#   components:   bottle-plus-components only; each retained component with its source and paths.
#   seam:         bottle-plus-seam only; each allowed hunk, by path and a stable anchor.
#   note:         anything else a maintainer must know.

features:
  Upscaling:
    policy: bottle-plus-seam
    paths:
      - src/Features/Upscaling.cpp
      - src/Features/Upscaling.h
      - src/Features/Upscaling/
      - features/Upscaling/
    # Permitted divergence from Bottle: guarded calls into the Neural Rendering feature (no NR logic
    # in Upscaling), plus the owner-approved fix F1. bottle_sync.py accepts a hunk when every added
    # line contains a `match` string and every removed line a `replaces` string.
    budget: 20
    seam:
      - path: src/Features/Upscaling.cpp
        anchor: "#include block"
        match: ['#include "NeuralRendering.h"']
      - path: src/Features/Upscaling.cpp
        anchor: "S1 - Upscale(), DLSS branch, the streamline.Upscale() input"
        match: ["Neural Rendering seam S1", "globals::features::neuralRendering.PrepareUpscaleInput("]
        replaces: ["streamline.Upscale(main.texture,"]
      - path: src/Features/Upscaling.cpp
        anchor: "S2+S3 - PerformUpscaling(), between Upscale() and UpscaleDepth()"
        match: ["Neural Rendering seams S2+S3", "globals::features::neuralRendering.ResolveUpscaledFrame("]
      - path: src/Features/Upscaling/Streamline.cpp
        anchor: "S5 - Streamline constants: slConstants.reset takes Upscaling::pendingDLSSReset (Bottle declares it, nothing reads it)"
        match: ["Neural Rendering seam", "pendingDLSSReset"]
        replaces: ["slConstants.reset = sl::Boolean::eFalse;"]
      - path: src/Features/Upscaling/Streamline.cpp
        anchor: "F1 - Streamline constants: motionVectorsDilated = eTrue (Personal fix, not an NR hook)"
        match: ["Personal fix F1", "motionVectorsDilated = sl::Boolean::eTrue;"]
        replaces: ["motionVectorsDilated = sl::Boolean::eFalse;"]
    note: >-
      S4 (ApplySharpening) eliminated: ResolveUpscaledFrame() copies NR's result back into
      sharpenerTexture. S5 keeps DLSS SR on NR's history boundary (NR toggle, loading screens).
      F1 is not part of the NR seam: Bottle's EncodeTexturesCS writes a 5x5 depth-dilated field
      into motionVectorCopyTexture for DLSS but tells Streamline it is undilated, so DLSS dilates
      it a second time and the foreground-motion rim at silhouettes shimmers. Originally Personal
      5947cf63af, dropped by the Bottle reset 9a4a770f43, restored 2026-09-26 after edge flicker
      was traced to it. Drop F1 if Bottle adopts it.

  PostProcessing:
    policy: bottle-plus-seam
    paths:
      - src/Features/PostProcessing.cpp
      - src/Features/PostProcessing.h
      - src/Features/PostProcessing/
      - features/Post Processing/
    # Owner-approved Personal changes to a Bottle feature (not a hook for another feature). Every
    # hunk is either a true->false/1->0 default flip or carries its "Personal ..." tag.
    budget: 50
    seam:
      - path: features/Post Processing/SKSE/Plugins/CommunityShaders/PostProcessing/default.json
        anchor: "P1 - shipped default preset: every effect \"enabled\": false, DisableVanillaTonemapping 0"
        match: ['"enabled": false,', '"DisableVanillaTonemapping": 0']
        replaces: ['"enabled": true,', '"DisableVanillaTonemapping": 1']
      - path: src/Features/PostProcessing.cpp
        anchor: "P1 - IsPipelineFeatureEnabledByDefault() fallback and SetupResources() initial enabled flags"
        match: ["Personal default P1", "->enabled = false;"]
        replaces: ["return true;", "->enabled = true;"]
      - path: src/Features/PostProcessing.h
        anchor: "P1 - IsDisabledByDefault() false; Settings::DisableVanillaTonemapping 0"
        match: ["Personal default P1"]
        replaces: ["IsDisabledByDefault() const override { return true; }", "DisableVanillaTonemapping = 1;"]
      - path: src/Features/PostProcessing/DoF.cpp
        anchor: "P2 - DoF::GetTargetLockEnabled(), DoF::GetInDialogue(), and the target validity check in DoF::Draw()"
        match: ["Personal fix P2", "auto* menuTopicManager = RE::MenuTopicManager::GetSingleton();", "IsMenuOpen(RE::DialogueMenu::MENU_NAME)"]
        replaces: ["g_TDM->GetCurrentTarget();", "MenuTopicManager::GetSingleton()->lastSpeaker;", "if (!target)"]
    note: >-
      P1 (2026-09-26): Post Processing is enabled at boot but ships with every pipeline effect
      off and DisableVanillaTonemapping 0, so a fresh install looks vanilla until the user opts
      into effects. Bottle disables the whole feature by default and turns eight effects on.
      With DisableVanillaTonemapping 0 an enabled Color Grading pass grades on top of the vanilla
      tonemap until the user ticks "Disable Vanilla Tonemapping". Personal carried a stricter variant
      (feature off too) as 90e57b9855 before the Bottle reset; the other presets in
      features/Post Processing/ are Bottle's, unmodified. When Bottle adds a pipeline effect,
      default it off in all three places.
      P2 (2026-09-26): with Target Focus on, DoF must blur only while something is actively
      targeted; with no target Draw() returns before any pass, so nothing is blurred. Bottle
      picks a target from three signals that each outlive the targeting. (a) Dialogue:
      MenuTopicManager::lastSpeaker stays set after the Dialogue Menu closes for as long as the
      NPC's line keeps playing, so focus lingered on the speaker. Personal's first fix
      (a7e142722c) gated on MenuTopicManager::menuOpen, but that is the manager's own bookkeeping
      and, as reported in game, stays set when the player leaves, re-enters and leaves again in
      quick succession (the engine-side cause is not traced). P2 gates on the Dialogue Menu being
      on the UI menu stack (UI::IsMenuOpen, as State.cpp does for the main/loading menus), which
      reflects the menu itself rather than the manager's state. (b) True Directional Movement: GetCurrentTarget() is only meaningful while
      GetTargetLockState() is true, so the lock state is now required. (c) A target that is
      disabled, deleted or has no 3D is dropped: its stale position used to drive the
      manual-focus fallback and could put the focus plane behind near-field geometry.
      Console Selection is unchanged; it is an explicit opt-in that follows the console's
      selected reference.

  NeuralRendering:
    policy: personal
    paths:
      - src/Features/NeuralRendering.cpp
      - src/Features/NeuralRendering.h
      - src/Features/NeuralRendering/
      - features/Neural Rendering/
      - package/Shaders/Common/NeuralRenderingCategories.hlsli
      - docs/development/neural-rendering.md

  HairStrands:
    policy: personal
    paths:
      - src/Features/HairStrands.cpp
      - src/Features/HairStrands.h
      - src/Features/HairStrands/
      - features/Hair Strands/
      - docs/development/hair-strands.md
      - tools/hair_strands_sim_check.py
    note: >-
      Owner request 2026-09-28: converts hair card meshes into GPU-skinned strands drawn inside the
      hair's own lighting pass (BSLightingShader vtable 6/7 hooks) with a strand variant of the
      hair's Lighting permutation (HairStrands/StrandLighting.hlsl includes Lighting.hlsl). Depends
      on Lighting.hlsl's VS_OUTPUT layout, its non-landscape base-colour/normal sampling and the
      double-sided TBN flip: re-check the hair_strands hunks after a Bottle sync that touches them.
      StrandSim.cs.hlsl ports TressFX 4.1's simulation (GPUOpen-Effects/TressFX ba0bdac, MIT: keep
      AMD's notice in the file). Not in .github/configs/shader-validation.yaml: compile
      StrandLighting.hlsl (VS and PS), StrandSkin.cs.hlsl and StrandSim.cs.hlsl by hand with fxc
      after shader edits. See docs/development/hair-strands.md.

  Screenshot:
    policy: bottle-plus-components
    paths:
      - src/Features/ScreenshotFeature.cpp
      - src/Features/ScreenshotFeature.h
      - features/Screenshot/
    components:
      srgb_fix:
        source: personal
        anchor: "WIC_FLAGS_FORCE_SRGB fix for double-encoded SDR PNGs (7607769991)"
        paths: ["src/Features/ScreenshotFeature.cpp"]
      nr_comparison_capture:
        source: personal
        anchor: "NeuralRenderingComparisonPath + Capture(overridePath, forceCleanNoUI) for NR's A/B capture (7b0ffa8f1f)"
        paths: ["src/Features/ScreenshotFeature.cpp", "src/Features/ScreenshotFeature.h"]

shared_integrations:
  # Every hunk that differs from Bottle in these files must contain a `match` string of one entry;
  # every `match` string must still be present. `anchor` says where the hunk lives.
  package/Shaders/Lighting.hlsl:
    nr_category_classification:
      source: personal
      anchor: "NeuralRenderingCategories include; Masks2 SV_Target7 output; category pack replacing Bottle's Masks2 write at the end of the PS"
      match: ['#include "Common/NeuralRenderingCategories.hlsli"', "float4 Masks2: SV_Target7;", "NeuralRenderingCategories::Pack("]
    hair_strands:
      source: personal
      anchor: "HAIR_STRANDS blocks: after the non-landscape base colour/normal sample (card colour without alpha, flat normal) and after the double-sided TBN flip (unflipped TBN for ribbons)"
      match: ["defined(HAIR_STRANDS)", "Hair Strands:"]
  package/Shaders/RunGrass.hlsl:
    nr_category_classification:
      source: personal
      anchor: "Masks2 Foliage category pack in both PS branches"
      match: ['#include "Common/NeuralRenderingCategories.hlsli"', "NeuralRenderingCategories::Pack("]
  package/Shaders/Common/Permutation.hlsli:
    local_extra_flags:
      source: personal
      anchor: "ExtraFlags: IsHumanoidActor (31), IsHair (30) for Neural Rendering; must mirror State.h"
      match: ["IsHumanoidActor", "IsHair"]
  src/State.h:
    local_extra_descriptors:
      source: personal
      anchor: "ExtraShaderDescriptors: IsHumanoidActor, IsHair (Neural Rendering), allocated downward from bit 31"
      match: ["IsHumanoidActor = 1u << 31", "IsHair = 1u << 30"]
  src/State.cpp:
    nr_settings_migration:
      source: personal
      anchor: "State::LoadFromJson, before any feature loads"
      match: ['#include "Features/NeuralRendering.h"', "NeuralRendering::MigrateLegacyUpscalingSettings(settings)"]
  src/Hooks.cpp:
    nr_finished_image:
      source: personal
      anchor: "PostProcessingExtensions::Main_HDRTonemapBlendCinematic_Render"
      match: ['#include "Features/NeuralRendering.h"', "neuralRendering.CaptureDisplayTransform(", "neuralRendering.ApplyFinishedImage(", "HandlePostProcessing(input, output)) {"]
  src/Deferred.cpp:
    nr_category_capture:
      source: personal
      anchor: "Deferred::EndDeferred (restore) and Main_RenderWorld_BlendedDecals (capture)"
      match: ['#include "Features/NeuralRendering.h"', "neuralRendering.RestoreCategories()", "neuralRendering.CaptureCategories()"]
  src/Feature.cpp:
    local_features:
      source: personal
      anchor: "GetFeatureList(): Neural Rendering, then Hair Strands, appended after Bottle's list"
      match: ['#include "Features/NeuralRendering.h"', "&globals::features::neuralRendering", '#include "Features/HairStrands.h"', "&globals::features::hairStrands"]
  src/Globals.cpp:
    local_features:
      source: personal
      anchor: "globals::features: Neural Rendering and Hair Strands instances appended"
      match: ['#include "Features/NeuralRendering.h"', "NeuralRendering neuralRendering{};", '#include "Features/HairStrands.h"', "HairStrands hairStrands{};"]
  src/Globals.h:
    local_features:
      source: personal
      anchor: "forward declaration and extern appended"
      match: ["struct NeuralRendering;", "extern NeuralRendering neuralRendering;", "struct HairStrands;", "extern HairStrands hairStrands;"]
  src/Menu.cpp:
    nr_hotkeys:
      source: personal
      anchor: "NeuralRendering toggle/compare/scale hotkeys after Effects 11 Editor's: load/save, StepNeuralRenderingScale, key actions, capture handlers"
      match: ["NeuralRendering"]
  src/Menu.h:
    nr_hotkeys:
      source: personal
      anchor: "capture flags and default key combos"
      match: ["NeuralRendering"]
  src/Menu/SettingsTabRenderer.cpp:
    nr_hotkeys:
      source: personal
      anchor: "hotkey widgets after Effects 11 Editor's"
      match: ["NeuralRendering"]
  src/Menu/SettingsTabRenderer.h:
    nr_hotkeys:
      source: personal
      anchor: "SettingsState capture flags"
      match: ["settingNeuralRendering"]

repository:
  # Whole files outside the features that differ from Bottle.
  personal_build:
    source: personal
    reason: "BuildPersonal.bat: BuildDev + prune excluded features + zip"
    paths: [BuildPersonal.bat]
  neural_rendering_build:
    source: personal
    reason: "Neural Rendering: NGX SDK include path; never commit the user-supplied nvngx_dlssnr.dll"
    paths: [cmake/Streamline/CMakeLists.txt, .gitignore]
  maintenance_records:
    source: personal
    reason: "this catalogue, provenance, upstream pins, the removed-features record and their docs"
    paths: [docs/development/README.md, docs/development/feature-provenance.yaml, docs/development/maintenance-policy.yaml, docs/development/upstreams.yaml, docs/development/maintainability.md, docs/development/removed-features.md, docs/development/history/]
  maintenance_tools:
    source: personal
    reason: "tools that enforce this catalogue"
    paths: [tools/bottle_sync.py, tools/provenance_audit.py]
  agent_instructions:
    source: personal
    reason: ".claude/CLAUDE.md: the Personal maintenance-baseline section"
    paths: [.claude/CLAUDE.md]
  generated_translations:
    source: generated
    reason: "en.json is regenerated from source by tools/extract-i18n.py; it differs by Neural Rendering's and Hair Strands' strings"
    paths: [package/SKSE/Plugins/CommunityShaders/Translations/en.json]
