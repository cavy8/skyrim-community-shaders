repository:
  # Whole files outside the features that differ from Bottle.
  fork_readme:
    source: personal
    reason: "the fork's own README (product name, what the fork is)"
    paths: [README.md]
  personal_build:
    source: personal
    reason: "BuildPersonal.bat: BuildDev + prune excluded features + zip"
    paths: [BuildPersonal.bat]
  neural_rendering_build:
    source: personal
    reason: "Neural Rendering: NGX SDK include path; never commit the user-supplied nvngx_dlssnr.dll"
    paths: [cmake/Streamline/CMakeLists.txt, .gitignore]
  maintenance_records:
    source: personal
    reason: "this catalogue, provenance, upstream pins and their docs"
    paths: [docs/development/README.md, docs/development/feature-provenance.yaml, docs/development/maintenance-policy.yaml, docs/development/upstreams.yaml, docs/development/maintainability.md, docs/development/maintain-refactor.md, docs/development/history/]
  maintenance_tools:
    source: personal
    reason: "tools that enforce this catalogue"
    paths: [tools/bottle_sync.py, tools/provenance_audit.py]
  agent_instructions:
    source: personal
    reason: ".claude/CLAUDE.md: the Personal maintenance-baseline section"
    paths: [.claude/CLAUDE.md]
  generated_translations:
    source: generated
    reason: "en.json is regenerated from source by tools/extract-i18n.py; it differs by the local features' strings"
    paths: [package/SKSE/Plugins/CommunityShaders/Translations/en.json]
